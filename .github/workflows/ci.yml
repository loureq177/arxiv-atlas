name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    # Same image as compose.yaml, so repository tests run against real Postgres + pgvector.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test

    steps:
      # Pinned to commit SHAs: a tag can be moved to different code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked
      # The same hooks as on a local commit: one definition of "clean code".
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pytest
