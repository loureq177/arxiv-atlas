services:
  db:
    image: docker.io/pgvector/pgvector:pg18
    # A tiny init as PID 1 reaps processes started with `exec`. Without it Postgres is
    # PID 1, inherits them, and treats one dying as a crash: it kills every connection.
    init: true
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
