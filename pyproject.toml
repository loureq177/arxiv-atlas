[project]
name = "arxiv-atlas"
version = "0.1.0"
description = "Fine-grained topic discovery and trend detection for arXiv ML papers"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
arxiv-atlas = "arxiv_atlas.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # bugbear: likely bugs
    "UP",      # pyupgrade: modern syntax
    "SIM",     # simplifications
    "C4",      # comprehensions
    "N",       # naming
    "PT",      # pytest style
    "RUF",     # ruff-specific
]

[tool.mypy]
strict = true
files = ["src", "tests"]
# Module names relative to src/ and the repo root, so tests are `tests.<pkg>.<module>`.
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
