[project]
name = "arxiv-atlas"
version = "0.1.0"
description = "Fine-grained topic discovery and trend detection for arXiv ML papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.scripts]
arxiv-atlas = "arxiv_atlas.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
